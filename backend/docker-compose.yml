services:
  postgres:
    image: postgres:16-alpine
    container_name: yunus-auto-garage-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yunus_auto_garage
    volumes:
      - yunus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yunus_auto_garage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yunus_pg_data:
